<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 Live Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red:#E8002D;--gold:#FFD700;--green:#00D47B;--purple:#9B59FF;--yellow:#FFC906;
      --bg:#0a0a0a;--bg-card:#111111;--bg-elevated:#1a1a1a;
      --border:rgba(255,255,255,0.07);--text-primary:#f0f0f0;--text-secondary:#888;--text-dim:#555;
      --header-bg:rgba(10,10,10,0.92);--logo-filter:brightness(0) invert(1) opacity(0.85);
    }
    [data-theme="light"] {
      --bg:#f5f5f5;--bg-card:#ffffff;--bg-elevated:#ececec;
      --border:rgba(0,0,0,0.08);--text-primary:#111111;--text-secondary:#555;--text-dim:#aaa;
      --header-bg:rgba(245,245,245,0.92);--logo-filter:none;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden;}
    header{position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
    .logo{display:flex;align-items:center;gap:10px;}
    .logo-mark{width:28px;height:28px;background:var(--red);clip-path:polygon(0 0,80% 0,100% 50%,80% 100%,0 100%,20% 50%);flex-shrink:0;}
    .logo-text{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;letter-spacing:.08em;}
    .logo-text span{color:var(--red);}
    .header-right{display:flex;align-items:center;gap:16px;}
    .mode-pill{display:flex;align-items:center;gap:6px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--text-secondary);}
    .mode-pill.live{border-color:var(--red);color:var(--red);}
    .mode-pill.live .dot{background:var(--red);animation:pulse 1.2s infinite;}
    .mode-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.8);}}
    .theme-toggle{width:36px;height:36px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-secondary);}
    .theme-toggle:hover{border-color:var(--red);}
    nav{display:flex;gap:4px;}
    .nav-tab{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-secondary);transition:all .15s;}
    .nav-tab:hover{color:var(--text-primary);background:var(--bg-elevated);}
    .nav-tab.active{background:var(--red);color:#fff;}
    main{padding:20px 24px 24px;}

    /* SEASON */
    #view-norace{display:none;flex-direction:column;gap:20px;}
    #view-norace.active{display:flex;}
    .standings-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
    .card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .card-title{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary);}
    .standings-table{width:100%;}
    .standings-row-item{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border);transition:background .15s;}
    .standings-row-item:last-child{border-bottom:none;}
    .standings-row-item:hover{background:var(--bg-elevated);}
    .s-pos{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);width:20px;text-align:center;flex-shrink:0;}
    .s-pos.top3{color:var(--gold);font-weight:700;}
    .team-logo-img{width:28px;height:28px;object-fit:contain;flex-shrink:0;filter:var(--logo-filter);}
    .team-color-bar{width:3px;height:28px;border-radius:2px;flex-shrink:0;}
    .driver-info{flex:1;min-width:0;}
    .driver-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .driver-team{font-size:11px;color:var(--text-secondary);}
    .s-points{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;flex-shrink:0;}
    .race-list{padding:8px 0;}
    .race-item{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
    .race-item:last-child{border-bottom:none;}
    .race-item:hover{background:var(--bg-elevated);}
    .race-item-left{display:flex;flex-direction:column;gap:3px;}
    .race-name{font-size:14px;font-weight:500;}
    .race-date{font-size:11px;color:var(--text-secondary);font-family:'JetBrains Mono',monospace;}
    .race-winner{font-size:12px;color:var(--text-secondary);}
    .race-winner span{color:var(--green);font-weight:600;}
    .chevron{color:var(--text-dim);font-size:14px;}
    .news-list{padding:8px 0;}
    .news-item{display:flex;gap:14px;padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
    .news-item:last-child{border-bottom:none;}
    .news-item:hover{background:var(--bg-elevated);}
    .news-dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:6px;}
    .news-title{font-size:13px;font-weight:500;line-height:1.4;}
    .news-meta{font-size:11px;color:var(--text-secondary);margin-top:3px;font-family:'JetBrains Mono',monospace;}

    /* RACE */
    #view-race{display:none;flex-direction:column;gap:16px;}
    #view-race.active{display:flex;}
    .race-grid{display:grid;grid-template-columns:280px 1fr 300px;gap:16px;height:calc(100vh - 160px);min-height:520px;}
    .tower{overflow-y:auto;}
    .tower-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);transition:background .15s;}
    .tower-row:hover{background:var(--bg-elevated);}
    .tower-pos{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--text-dim);width:20px;text-align:center;flex-shrink:0;}
    .tower-pos.p1{color:var(--gold);}
    .tower-color-bar{width:3px;height:32px;border-radius:2px;flex-shrink:0;}
    .tower-logo{width:22px;height:22px;object-fit:contain;flex-shrink:0;filter:var(--logo-filter);}
    .tower-driver{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
    .tower-driver-code{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:.05em;}
    .tower-driver-info{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-secondary);font-family:'JetBrains Mono',monospace;}
    .tyre-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:700;flex-shrink:0;}
    .tyre-S{background:var(--red);color:#fff;}
    .tyre-M{background:var(--gold);color:#000;}
    .tyre-H{background:#ccc;color:#000;}
    .tyre-I{background:#00b4d8;color:#fff;}
    .tyre-W{background:#0077b6;color:#fff;}
    .tower-gap{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-secondary);text-align:right;flex-shrink:0;}
    .tower-gap.leader{color:var(--gold);font-weight:700;}
    .track-map-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
    .track-map-body{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
    #track-svg-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
    #track-svg-container svg{max-width:100%;max-height:100%;}
    .sectors{overflow-y:auto;}
    .sector-row{padding:8px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr repeat(3,auto);gap:8px;align-items:center;}
    .sector-driver-name{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;letter-spacing:.04em;}
    .sector-time{font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 6px;border-radius:4px;text-align:center;font-weight:500;}
    .sector-time.purple{background:rgba(155,89,255,.2);color:var(--purple);}
    .sector-time.green{background:rgba(0,212,123,.15);color:var(--green);}
    .sector-time.yellow{background:rgba(255,201,6,.12);color:var(--yellow);}
    .sector-time.default{background:var(--bg-elevated);color:var(--text-secondary);}
    .tyre-strip{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;}
    .tyre-inventory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
    .tyre-driver-block{background:var(--bg-elevated);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
    .tyre-driver-label{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;}
    .tyre-compound-row{display:flex;align-items:center;gap:6px;}
    .tyre-compound-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;width:14px;flex-shrink:0;}
    .tyre-compound-lbl.S{color:var(--red);}
    .tyre-compound-lbl.M{color:var(--gold);}
    .tyre-compound-lbl.H{color:#aaa;}
    .tyre-sets{display:flex;gap:3px;flex-wrap:wrap;}
    .tyre-set{width:18px;height:18px;border-radius:50%;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid transparent;}
    .tyre-set.used{opacity:.3;}
    .tyre-set.S{background:rgba(232,0,45,.15);border-color:var(--red);color:var(--red);}
    .tyre-set.M{background:rgba(255,215,0,.12);border-color:var(--gold);color:var(--gold);}
    .tyre-set.H{background:rgba(200,200,200,.1);border-color:#aaa;color:#aaa;}

    /* STATUS BAR */
    .status-bar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--bg-elevated);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-secondary);margin-bottom:0;}
    .status-bar .status-item{display:flex;align-items:center;gap:6px;}
    .status-bar .status-sep{color:var(--text-dim);}

    /* MODAL */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;width:480px;max-height:80vh;overflow-y:auto;}
    .modal-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg-card);}
    .modal-title{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;letter-spacing:.04em;}
    .modal-close{width:28px;height:28px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:14px;}
    .result-row{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);font-size:13px;}
    .result-row:last-child{border-bottom:none;}
    .result-pos{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);width:24px;text-align:center;flex-shrink:0;}
    .result-pos.podium{color:var(--gold);font-weight:700;}
    .result-info{flex:1;min-width:0;}
    .result-name{font-weight:500;}
    .result-team{font-size:11px;color:var(--text-secondary);}
    .result-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-secondary);flex-shrink:0;}
    .result-pts{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;width:40px;text-align:right;flex-shrink:0;}

    @media(max-width:900px){
      .standings-row{grid-template-columns:1fr;}
      .race-grid{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto;}
      .tower,.sectors{max-height:300px;}
      header{padding:0 12px;}
      main{padding:12px;}
    }
    .fade-in{animation:fadeIn .3s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-mark"></div>
      <div class="logo-text">APEX<span>LIVE</span></div>
    </div>
    <nav>
      <button class="nav-tab active" onclick="switchView('norace')">Season</button>
      <button class="nav-tab" onclick="switchView('race')">Race</button>
    </nav>
    <div class="header-right">
      <div class="mode-pill" id="mode-pill"><div class="dot"></div><span id="mode-label">NO SESSION</span></div>
      <button class="theme-toggle" onclick="toggleTheme()"><span id="theme-icon">☀️</span></button>
    </div>
  </header>

  <main>
    <!-- SEASON -->
    <div id="view-norace" class="active fade-in">
      <div class="standings-row">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Driver Championship</span>
            <span style="font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;">2025</span>
          </div>
          <div class="standings-table" id="driver-standings"></div>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">Constructor Championship</span>
            <span style="font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;">2025</span>
          </div>
          <div class="standings-table" id="constructor-standings"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Race Results — 2025</span></div>
        <div class="race-list" id="race-list"></div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Latest News</span>
          <span style="font-size:11px;color:var(--text-dim);">via formula1.com</span>
        </div>
        <div class="news-list" id="news-list"></div>
      </div>
    </div>

    <!-- RACE -->
    <div id="view-race" class="fade-in">
      <!-- status bar -->
      <div class="status-bar" id="live-status-bar">
        <div class="status-item">
          <span style="color:var(--text-dim);">SESSION</span>
          <span id="sb-session">—</span>
        </div>
        <span class="status-sep">·</span>
        <div class="status-item">
          <span style="color:var(--text-dim);">LAP</span>
          <span id="sb-lap">—</span>
        </div>
        <span class="status-sep">·</span>
        <div class="status-item">
          <span style="color:var(--text-dim);">UPDATED</span>
          <span id="sb-updated">—</span>
        </div>
        <span class="status-sep">·</span>
        <div class="status-item" id="sb-error-wrap" style="display:none;">
          <span style="color:var(--red);" id="sb-error">—</span>
        </div>
      </div>

      <div class="race-grid">
        <div class="card tower" id="live-tower">
          <div class="card-header" style="position:sticky;top:0;background:var(--bg-card);z-index:10;">
            <span class="card-title">Live Tower</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-secondary);" id="lap-counter">LAP — / —</span>
          </div>
        </div>
        <div class="track-map-card">
          <div class="card-header">
            <span class="card-title" id="circuit-name">Monaco Grand Prix</span>
            <span style="font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;" id="session-type">RACE</span>
          </div>
          <div class="track-map-body">
            <div id="track-svg-container">
              <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" id="track-svg">
                <path fill="none" stroke="var(--border)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
                  d="M200,40 L320,40 Q360,40 360,80 L360,120 Q360,150 330,160 L280,175 Q260,182 255,200 L255,240 Q255,260 240,270 L200,285 Q180,290 175,310 L175,340 Q175,360 155,365 L120,368 Q100,368 95,350 L90,300 Q88,280 100,265 L130,240 Q145,228 145,210 L145,180 Q145,160 130,150 L80,130 Q60,120 60,100 L60,80 Q60,55 85,45 L140,40 Z"/>
                <path fill="none" stroke="var(--bg-elevated)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
                  d="M200,40 L320,40 Q360,40 360,80 L360,120 Q360,150 330,160 L280,175 Q260,182 255,200 L255,240 Q255,260 240,270 L200,285 Q180,290 175,310 L175,340 Q175,360 155,365 L120,368 Q100,368 95,350 L90,300 Q88,280 100,265 L130,240 Q145,228 145,210 L145,180 Q145,160 130,150 L80,130 Q60,120 60,100 L60,80 Q60,55 85,45 L140,40 Z"/>
                <g id="driver-dots"></g>
              </svg>
            </div>
          </div>
        </div>
        <div class="card sectors" id="sector-panel">
          <div class="card-header" style="position:sticky;top:0;background:var(--bg-card);z-index:10;">
            <span class="card-title">Sector Times</span>
            <div style="display:flex;gap:6px;font-size:10px;font-family:'JetBrains Mono',monospace;">
              <span style="color:var(--purple);">■ BEST</span>
              <span style="color:var(--green);">■ PB</span>
              <span style="color:var(--yellow);">■ —</span>
            </div>
          </div>
        </div>
      </div>

      <div class="tyre-strip">
        <div class="card-title" style="margin-bottom:12px;">Tyre Inventory</div>
        <div class="tyre-inventory-grid" id="tyre-inventory"></div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="result-modal" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modal-race-title">Race Results</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

<script>
// ── THEME ──
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
}

// ── VIEW SWITCH ──
function switchView(view) {
  document.getElementById('view-norace').classList.toggle('active', view === 'norace');
  document.getElementById('view-race').classList.toggle('active', view === 'race');
  document.querySelectorAll('.nav-tab').forEach((t,i) =>
    t.classList.toggle('active', (i===0&&view==='norace')||(i===1&&view==='race')));
  if (view === 'race') startLiveRace();
}

// ── CONSTANTS ──
const TEAM_COLORS = {
  'Red Bull':'#3671C6','Ferrari':'#E8002D','Mercedes':'#27F4D2',
  'McLaren':'#FF8000','Aston Martin':'#229971','Alpine':'#FF87BC',
  'Williams':'#64C4FF','Haas':'#B6BABD','Kick Sauber':'#52E252','RB':'#6692FF',
};
const TEAM_LOGOS = {
  'Red Bull':     'https://upload.wikimedia.org/wikipedia/en/thumb/8/8c/Red_Bull_Racing_2022_logo.svg/120px-Red_Bull_Racing_2022_logo.svg.png',
  'Ferrari':      'https://upload.wikimedia.org/wikipedia/en/thumb/d/d8/Scuderia_Ferrari_HP_logo.svg/120px-Scuderia_Ferrari_HP_logo.svg.png',
  'Mercedes':     'https://upload.wikimedia.org/wikipedia/en/thumb/f/fb/Mercedes_AMG_Petronas_F1_Logo_%282022%29.svg/120px-Mercedes_AMG_Petronas_F1_Logo_%282022%29.svg.png',
  'McLaren':      'https://upload.wikimedia.org/wikipedia/en/thumb/6/66/McLaren_Racing_logo.svg/120px-McLaren_Racing_logo.svg.png',
  'Aston Martin': 'https://upload.wikimedia.org/wikipedia/en/thumb/2/2a/Aston_Martin_Aramco_logo.svg/120px-Aston_Martin_Aramco_logo.svg.png',
  'Alpine':       'https://upload.wikimedia.org/wikipedia/en/thumb/7/76/Alpine_F1_Team_Logo.svg/120px-Alpine_F1_Team_Logo.svg.png',
  'Williams':     'https://upload.wikimedia.org/wikipedia/en/thumb/8/81/Williams_Racing_logo.svg/120px-Williams_Racing_logo.svg.png',
  'Haas':         'https://upload.wikimedia.org/wikipedia/en/thumb/7/7a/MoneyGram_Haas_F1_Team_logo_2024.svg/120px-MoneyGram_Haas_F1_Team_logo_2024.svg.png',
  'Kick Sauber':  'https://upload.wikimedia.org/wikipedia/en/thumb/9/97/Kick_Sauber_2024_Logo.svg/120px-Kick_Sauber_2024_Logo.svg.png',
  'RB':           'https://upload.wikimedia.org/wikipedia/en/thumb/8/87/RB_F1_Team_Logo_2024.svg/120px-RB_F1_Team_Logo_2024.svg.png',
};
const TYRE_MAP = { 'SOFT':'S','MEDIUM':'M','HARD':'H','INTERMEDIATE':'I','WET':'W' };

function teamLogo(team, cls='team-logo-img') {
  const src = TEAM_LOGOS[team];
  if (!src) return `<div style="width:28px;height:28px;background:${TEAM_COLORS[team]||'#888'};border-radius:4px;opacity:.5;flex-shrink:0;"></div>`;
  return `<img src="${src}" class="${cls}" alt="${team}" onerror="this.style.display='none'">`;
}

function normaliseTeam(name='') {
  if (name.includes('Red Bull'))    return 'Red Bull';
  if (name.includes('Ferrari'))     return 'Ferrari';
  if (name.includes('Mercedes'))    return 'Mercedes';
  if (name.includes('McLaren'))     return 'McLaren';
  if (name.includes('Aston'))       return 'Aston Martin';
  if (name.includes('Alpine'))      return 'Alpine';
  if (name.includes('Williams'))    return 'Williams';
  if (name.includes('Haas'))        return 'Haas';
  if (name.includes('Sauber')||name.includes('Kick')) return 'Kick Sauber';
  if (name.includes('Racing Bulls')||name.includes('RB')) return 'RB';
  return name || 'Unknown';
}

let DRIVER_STANDINGS=[], CONSTRUCTOR_STANDINGS=[], RACE_RESULTS=[], RACE_CACHE={};
const JOLPICA = 'https://api.jolpi.ca/ergast/f1';

async function fetchDriverStandings() {
  const r = await fetch(`${JOLPICA}/2025/driverStandings.json`);
  const j = await r.json();
  DRIVER_STANDINGS = (j.MRData.StandingsTable.StandingsLists[0]?.DriverStandings||[]).map(d=>({
    pos:parseInt(d.position), name:`${d.Driver.givenName} ${d.Driver.familyName}`,
    team:normaliseTeam(d.Constructors[0]?.name), pts:parseFloat(d.points),
    code:d.Driver.code||d.Driver.familyName.slice(0,3).toUpperCase(),
  }));
}
async function fetchConstructorStandings() {
  const r = await fetch(`${JOLPICA}/2025/constructorStandings.json`);
  const j = await r.json();
  CONSTRUCTOR_STANDINGS = (j.MRData.StandingsTable.StandingsLists[0]?.ConstructorStandings||[]).map(c=>({
    pos:parseInt(c.position), name:normaliseTeam(c.Constructor.name), pts:parseFloat(c.points),
  }));
}
async function fetchRaceList() {
  const r = await fetch(`${JOLPICA}/2025/results/1.json?limit=30`);
  const j = await r.json();
  RACE_RESULTS = (j.MRData.RaceTable.Races||[]).map(race=>({
    name:race.raceName, date:race.date, round:race.round,
    winner:`${race.Results[0].Driver.givenName} ${race.Results[0].Driver.familyName}`,
  }));
}
async function fetchRaceResults(round) {
  if (RACE_CACHE[round]) return RACE_CACHE[round];
  const r = await fetch(`${JOLPICA}/2025/${round}/results.json`);
  const j = await r.json();
  const results = (j.MRData.RaceTable.Races[0]?.Results||[]).map(res=>({
    pos:parseInt(res.position), driver:`${res.Driver.givenName} ${res.Driver.familyName}`,
    team:normaliseTeam(res.Constructor.name),
    time:res.Time?.time||res.status||'DNF', pts:parseFloat(res.points),
  }));
  RACE_CACHE[round]=results; return results;
}

// ── OPENF1 LIVE ──
const F1_API = 'https://api.openf1.org/v1';
let SESSION_KEY = null;
let DRIVERS_MAP = {};   // driver_number → {code, team, name}
let liveInterval = null;

async function getLatestSession() {
  const r = await fetch(`${F1_API}/sessions?session_key=latest`);
  const sessions = await r.json();
  if (!sessions.length) throw new Error('No live session found');
  // get most recent
  sessions.sort((a,b) => new Date(b.date_start) - new Date(a.date_start));
  return sessions[0];
}

async function loadDrivers(sessionKey) {
  const r = await fetch(`${F1_API}/drivers?session_key=${sessionKey}`);
  const drivers = await r.json();
  DRIVERS_MAP = {};
  drivers.forEach(d => {
    DRIVERS_MAP[d.driver_number] = {
      code: d.name_acronym || '???',
      name: d.full_name || '',
      team: normaliseTeam(d.team_name||''),
      num:  d.driver_number,
    };
  });
}

async function fetchLiveData(sessionKey) {
  const [posRes, intRes, stintRes, pitRes, lapRes] = await Promise.all([
    fetch(`${F1_API}/position?session_key=${sessionKey}&date>=${recentDate()}`),
    fetch(`${F1_API}/intervals?session_key=${sessionKey}&date>=${recentDate()}`),
    fetch(`${F1_API}/stints?session_key=${sessionKey}`),
    fetch(`${F1_API}/pit?session_key=${sessionKey}`),
    fetch(`${F1_API}/laps?session_key=${sessionKey}&lap_number>=${await getLatestLap(sessionKey)}`),
  ]);
  return {
    positions: await posRes.json(),
    intervals: await intRes.json(),
    stints:    await stintRes.json(),
    pits:      await pitRes.json(),
    laps:      await lapRes.json(),
  };
}

function recentDate() {
  const d = new Date(Date.now() - 30000); // last 30s
  return d.toISOString();
}

let _latestLapCache = 1;
async function getLatestLap(sessionKey) {
  try {
    const r = await fetch(`${F1_API}/laps?session_key=${sessionKey}&driver_number=1&lap_number>=${_latestLapCache}`);
    const laps = await r.json();
    if (laps.length) _latestLapCache = Math.max(...laps.map(l=>l.lap_number));
  } catch(e){}
  return Math.max(1, _latestLapCache - 2);
}

function processLiveData(data) {
  // Latest position per driver
  const latestPos = {};
  data.positions.forEach(p => {
    const dn = p.driver_number;
    if (!latestPos[dn] || new Date(p.date) > new Date(latestPos[dn].date))
      latestPos[dn] = p;
  });

  // Latest interval per driver
  const latestInt = {};
  data.intervals.forEach(i => {
    const dn = i.driver_number;
    if (!latestInt[dn] || new Date(i.date) > new Date(latestInt[dn].date))
      latestInt[dn] = i;
  });

  // Latest stint per driver
  const latestStint = {};
  data.stints.forEach(s => {
    const dn = s.driver_number;
    if (!latestStint[dn] || s.stint_number > (latestStint[dn].stint_number||0))
      latestStint[dn] = s;
  });

  // Pit count per driver
  const pitCount = {};
  data.pits.forEach(p => {
    pitCount[p.driver_number] = (pitCount[p.driver_number]||0) + 1;
  });

  // Latest lap sector times per driver
  const latestLap = {};
  data.laps.forEach(l => {
    const dn = l.driver_number;
    if (!latestLap[dn] || l.lap_number > (latestLap[dn].lap_number||0))
      latestLap[dn] = l;
  });

  // Build ordered driver list
  const drivers = Object.values(latestPos)
    .sort((a,b) => a.position - b.position)
    .map(p => {
      const dn = p.driver_number;
      const d = DRIVERS_MAP[dn] || {code:'???',team:'Unknown',name:'Unknown',num:dn};
      const stint = latestStint[dn];
      const interval = latestInt[dn];
      const lap = latestLap[dn];
      const tyreCode = TYRE_MAP[stint?.compound] || '?';
      const tyreLap = stint ? (_latestLapCache - (stint.lap_start||1) + 1) : 0;
      const pits = pitCount[dn] || 0;
      const gap = p.position === 1 ? 'LEADER'
        : interval?.gap_to_leader != null ? `+${Number(interval.gap_to_leader).toFixed(3)}` : '—';

      return {
        pos:    p.position,
        code:   d.code,
        team:   d.team,
        gap,
        tyre:   tyreCode,
        tyreLap,
        pits,
        s1: classifySector(lap?.duration_sector_1),
        s2: classifySector(lap?.duration_sector_2),
        s3: classifySector(lap?.duration_sector_3),
        s1t: formatSector(lap?.duration_sector_1),
        s2t: formatSector(lap?.duration_sector_2),
        s3t: formatSector(lap?.duration_sector_3),
      };
    });

  return { drivers, currentLap: _latestLapCache };
}

function classifySector(val) {
  if (val == null) return 'default';
  // Without full session data we can't do purple/green properly
  // so use yellow as neutral
  return 'yellow';
}

function formatSector(val) {
  if (val == null) return '—';
  return Number(val).toFixed(3);
}

function updateUI(processed) {
  const { drivers, currentLap } = processed;
  if (!drivers.length) return;

  // Update lap counter
  document.getElementById('lap-counter').textContent = `LAP ${currentLap} / 78`;
  document.getElementById('sb-lap').textContent = currentLap;
  document.getElementById('sb-updated').textContent = new Date().toLocaleTimeString();
  document.getElementById('sb-error-wrap').style.display = 'none';

  // Tower
  const tower = document.getElementById('live-tower');
  const header = tower.querySelector('.card-header');
  tower.innerHTML = '';
  tower.appendChild(header);
  drivers.forEach(d => {
    const row = document.createElement('div');
    row.className = 'tower-row';
    row.innerHTML = `
      <div class="tower-pos ${d.pos===1?'p1':''}">${d.pos}</div>
      <div class="tower-color-bar" style="background:${TEAM_COLORS[d.team]||'#888'}"></div>
      ${teamLogo(d.team,'tower-logo')}
      <div class="tower-driver">
        <div class="tower-driver-code">${d.code}</div>
        <div class="tower-driver-info">
          <span class="tyre-badge tyre-${d.tyre}">${d.tyre}</span>
          <span>${d.tyreLap}L</span>
          <span>·</span>
          <span>${d.pits} pit${d.pits!==1?'s':''}</span>
        </div>
      </div>
      <div class="tower-gap ${d.pos===1?'leader':''}">${d.gap}</div>`;
    tower.appendChild(row);
  });

  // Sectors
  const sp = document.getElementById('sector-panel');
  const sHeader = sp.querySelector('.card-header');
  sp.innerHTML = '';
  sp.appendChild(sHeader);
  drivers.forEach(d => {
    const row = document.createElement('div');
    row.className = 'sector-row';
    row.innerHTML = `
      <div class="sector-driver-name" style="color:${TEAM_COLORS[d.team]||'var(--text-primary)'}">${d.code}</div>
      <div class="sector-time ${d.s1}" title="${d.s1t}">${d.s1t}</div>
      <div class="sector-time ${d.s2}" title="${d.s2t}">${d.s2t}</div>
      <div class="sector-time ${d.s3}" title="${d.s3t}">${d.s3t}</div>`;
    sp.appendChild(row);
  });

  // Driver dots on map (placeholder positions for now)
  updateDriverDots(drivers);
}

function showLiveError(msg) {
  document.getElementById('sb-error-wrap').style.display = 'flex';
  document.getElementById('sb-error').textContent = msg;
}

async function startLiveRace() {
  // Clear any existing interval
  if (liveInterval) clearInterval(liveInterval);

  document.getElementById('sb-session').textContent = 'Monaco GP';
  document.getElementById('sb-updated').textContent = 'Connecting...';

  // Set live pill
  const pill = document.getElementById('mode-pill');
  pill.classList.add('live');
  document.getElementById('mode-label').textContent = 'LIVE';

  try {
    // Get session
    const session = await getLatestSession();
    SESSION_KEY = session.session_key;
    document.getElementById('circuit-name').textContent = session.meeting_name || 'Monaco Grand Prix';
    document.getElementById('session-type').textContent = session.session_name || 'RACE';

    // Load drivers
    await loadDrivers(SESSION_KEY);

    // Initial fetch + render
    await fetchAndRender();

    // Poll every 5 seconds
    liveInterval = setInterval(fetchAndRender, 5000);

  } catch(e) {
    console.error('OpenF1 error:', e);
    showLiveError('API error — retrying...');
    pill.classList.remove('live');
    document.getElementById('mode-label').textContent = 'NO SESSION';
    // Fallback to mock
    renderMockRace();
  }
}

async function fetchAndRender() {
  try {
    const data = await fetchLiveData(SESSION_KEY);
    const processed = processLiveData(data);
    if (processed.drivers.length > 0) {
      updateUI(processed);
    } else {
      showLiveError('No live data yet');
    }
  } catch(e) {
    console.error('Fetch error:', e);
    showLiveError('Fetch failed — retrying');
  }
}
